
name: Build NOTERA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract NOTERA
        run: |
          unzip -q NOTERA-v2_1.zip -d extracted
          test -f extracted/NOTERA/index.html
          mkdir -p www
          cp -r extracted/NOTERA/. www/

      - name: Initialize Node project
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6.2.1
          npm install @capacitor/cli@6.2.1
          npm install @capacitor/android@6.2.1

      - name: Configure NOTERA
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.notera.app",
            "appName": "NOTERA",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build NOTERA APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOTERA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
